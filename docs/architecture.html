<desc id="architecture-desc">On-device button or Okay Nabu starts a gateway-managed Grok session, with encrypted microphone transport and local HTTP speaker replies.</desc>

<text x="40" y="72" font-family="'Instrument Serif',serif" font-size="28" fill="#2d3142">Voice PE → gateway → Grok</text>
<text x="40" y="108" font-family="'Geist',system-ui,sans-serif" font-size="12" fill="#4f5d75">Local wake detection. Cloud audio only during an accepted call.</text>
<path d="M240 248 H360" stroke="#2e5aa8" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M360 312 H240" stroke="#2e5aa8" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>

<rect x="608" y="284" width="104" height="16" fill="#f5f5f5"/><text x="660" y="296" text-anchor="middle" font-family="'Geist Mono',monospace" font-size="8" fill="#2e5aa8">WSS / REPLY</text>

<text x="56" y="284" font-family="'Geist',system-ui,sans-serif" font-size="12" fill="#4f5d75">Microphone + mute</text>
<text x="56" y="316" font-family="'Geist',system-ui,sans-serif" font-size="12" fill="#4f5d75">Speaker playback</text>
<rect x="360" y="184" width="240" height="192" rx="8" fill="#f5f5f5" stroke="#bf4520" stroke-width="1.5"/>

<text x="376" y="284" font-family="'Geist',system-ui,sans-serif" font-size="12" fill="#4f5d75">Discard idle microphone audio</text>
<text x="376" y="316" font-family="'Geist',system-ui,sans-serif" font-size="12" fill="#4f5d75">Manage session + stream replies</text>

<text x="736" y="316" font-family="'Geist',system-ui,sans-serif" font-size="12" fill="#4f5d75">Secure WebSocket</text>

<text x="40" y="456" font-family="'Geist',system-ui,sans-serif" font-size="12" fill="#4f5d75">Gateway auth: separate Hermes Agent on Python 3.14; operator-owned OAuth account.</text>
